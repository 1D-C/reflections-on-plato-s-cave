<html>
<head>
  <title>Dreamers</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: "Courier New", monospace;
      text-align: center;
      margin-top: 100px;
    }
    button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: 1px solid white;
      cursor: pointer;
    }
    a {
      transition: 0.3s;
    }
    a:link {
      color: white;
      background-color: transparent;
      text-decoration: none;
    }
    a:visited {
      color: white;
      background-color: transparent;
      text-decoration: none;
    }
    a:hover {
      color: black;
      background-color: transparent;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <p>You find a mysterious sign...</p>
  <a href="./path.html">
    <button>Follow the sign</button>
  </a>
</body>
</html>
