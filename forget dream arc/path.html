<html>
<head>
  <title>Dreamers</title>
  <style>
    body {
      background-image: url('../images/pathway.png');
      background-size: cover;
      color: white;
      font-family: "Courier New", monospace;
      text-align: center;
      margin-top: 100px;
    }
    button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: 1px solid white;
      cursor: pointer;
    }
    a {
      transition: 0.3s;

      text-decoration: none;

    a:visited {

      background-color: transparent;
      text-decoration: none;
    }
    a:hover {
      color: black;
      background-color: transparent;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <a href="./reflection.html">

</html>
